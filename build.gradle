import org.gradle.api.file.FileCollection
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.testing.Test
import org.gradle.process.CommandLineArgumentProvider

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.hibernate.orm' version '7.4.5.Final'
	id 'org.graalvm.buildtools.native' version '1.1.8'
}

group = 'io.github.wskr00'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.add('-parameters')
}

ext {
	set('springAiVersion', "2.0.1")
}

configurations {
	// Keep Mockito's inline mock maker compatible with modern JDKs without dynamic self-attachment.
	mockitoAgent
}

dependencies {
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:4.2.0"
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

hibernate {
	enhancement {
	}
}

def mockitoAgentArgumentProvider = new CommandLineArgumentProvider() {
	@InputFiles
	@PathSensitive(PathSensitivity.RELATIVE)
	FileCollection agentFiles = configurations.mockitoAgent

	@Override
	Iterable<String> asArguments() {
		["-javaagent:${this.agentFiles.singleFile}"]
	}
}

tasks.named('test', Test) {
	useJUnitPlatform()
	jvmArgumentProviders.add(mockitoAgentArgumentProvider)
}

tasks.named('processTestAot', JavaExec) {
	jvmArgumentProviders.add(mockitoAgentArgumentProvider)
}

bootRun {
    environment 'spring.output.ansi.console-available', true
}
