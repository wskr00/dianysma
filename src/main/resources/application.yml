server:
    port: ${SERVER_PORT:8000}
    max-http-request-header-size: 16KB
logging:
    structured:
        format:
            console: ecs
dianysma:
    security:
        scopes:
            knowledge-read: ${KNOWLEDGE_READ_SCOPE:dianysma/knowledge.read}
            knowledge-write: ${KNOWLEDGE_WRITE_SCOPE:dianysma/knowledge.write}
spring:
    config:
        import: "optional:file:.env[.properties]"
    threads:
        virtual:
            enabled: true
    datasource:
        url: "jdbc:postgresql://${DATABASE_HOST:127.0.0.1}:${DATABASE_PORT:5432}/${DATABASE_NAME:dianysma}"
        username: ${DATABASE_USER:dianysma}
        password: ${DATABASE_PASSWORD:dianysma}
        hikari:
            maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:4}
            minimum-idle: ${DATABASE_POOL_MIN_IDLE:0}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
    application:
        name: dianysma
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_tiO9naD5t}
                    audiences:
                        - ${MCP_RESOURCE_URI:}
    ai:
        google:
            genai:
                embedding:
                    api-key: ${GEMINI_API_KEY:}
                    text:
                        model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
                        dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:1536}
        vectorstore:
            pgvector:
                dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:1536}
                distance-type: COSINE_DISTANCE
                index-type: HNSW
                initialize-schema: false
        mcp:
            server:
                protocol: STATELESS
                streamable-http:
                    mcp-endpoint: ${MCP_ENDPOINT_PATH:/mcp}
