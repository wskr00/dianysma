server:
    port: ${SERVER_PORT:8000}
logging:
    structured:
        format:
            console: ecs
dianysma:
    security:
        scopes:
            knowledge-read: ${KNOWLEDGE_READ_SCOPE:dianysma/knowledge.read}
            knowledge-write: ${KNOWLEDGE_WRITE_SCOPE:dianysma/knowledge.write}
spring:
    config:
        import: "optional:file:.env[.properties]"
    datasource:
        url: "jdbc:postgresql://${DATABASE_HOST:127.0.0.1}:${DATABASE_PORT:5432}/${DATABASE_NAME:dianysma}"
        username: ${DATABASE_USER:dianysma}
        password: ${DATABASE_PASSWORD:dianysma}
    jpa:
        hibernate:
            ddl-auto: validate
    application:
        name: dianysma
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${COGNITO_ISSUER_URI}
                    audiences:
                        - ${MCP_RESOURCE_URI}
    ai:
        google:
            genai:
                embedding:
                    api-key: ${GEMINI_API_KEY:}
                    text:
                        model: gemini-embedding-2
                        dimensions: 1536
        vectorstore:
            pgvector:
                dimensions: 1536
                distance-type: COSINE_DISTANCE
                index-type: HNSW
                initialize-schema: false
        mcp:
            server:
                protocol: STATELESS
                streamable-http:
                    mcp-endpoint: ${MCP_ENDPOINT_PATH:/mcp}
