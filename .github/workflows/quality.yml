name: Quality

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "VERSION"
      - "Dockerfile"
      - ".golangci.yml"

permissions: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(main.go)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find src -type f -name '*.go' -print0)

          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'These Go files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        env:
          GOFLAGS: -tags=integration
        with:
          version: v2.14.0

      - name: Run tests
        run: go test -count=1 -tags=integration ./...

      - name: Build
        run: go build ./...
